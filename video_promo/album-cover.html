html { background: linear-gradient(135deg, #0a0e1a, #111827, #1a2332); width: 500px; height: 500px; }
body {
  width: 500px; height: 500px; overflow: hidden;
  background: linear-gradient(135deg, #0a0e1a, #111827, #1a2332);
  font-family: 'NotoSC', 'SimHei', 'Segoe UI', sans-serif;
  color: #e6edf6;

  display: flex; flex-direction: column;

  content: ''; position: absolute; inset: 0;
  background-image:

.icon-card {
  position: relative; z-index: 1;

  background: linear-gradient(135deg, rgba(59,130,246,0.18), rgba(245,158,11,0.10));
  border: 1px solid rgba(59,130,246,0.4);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.icon-card svg {
  width: 110px; height: 110px;
  filter: drop-shadow(0 2px 8px rgba(96,165,250,0.4));
}
.title {
  position: relative; z-index: 1;
  font-family: 'SimHei', 'NotoSC', sans-serif;
  font-size: 56px; font-weight: 900; letter-spacing: 4px;
  background: linear-gradient(135deg, #60a5fa, #f59e0b);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;

  text-align: center;
