name: release

# 触发条件：推送 v*.*.* 形式的 tag 时自动构建并发布 Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write   # 允许创建/上传 Release 资源

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.13 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: 安装构建依赖 (x64)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller scapy

      - name: 下载 Ookla Speedtest CLI
        shell: pwsh
        run: |
          # speedtest/ 目录被 .gitignore 忽略, GitHub 上没有 speedtest.exe
          # 但 NetPulse.spec 把它作为 datas 打包, 所以 Actions 必须先下载一份
          # (仅 x64 — Ookla 官方无 win32 版, x86 构建不打包它)
          $dst = "speedtest/speedtest.exe"
          if (-not (Test-Path $dst)) {
            New-Item -ItemType Directory -Force -Path "speedtest" | Out-Null
            $url = "https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-win64.zip"
            Write-Host "正在从 Ookla 官方下载 Speedtest CLI..."
            $zip = "$env:TEMP\ookla-speedtest.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
            Write-Host "下载完成, 解压中..."
            Expand-Archive -Path $zip -DestinationPath "$env:TEMP\ookla-extract" -Force
            # zip 结构: speedtest.exe 直接在根
            Copy-Item "$env:TEMP\ookla-extract\speedtest.exe" -Destination $dst -Force
            Write-Host "已就位: $dst"
          } else {
            Write-Host "speedtest.exe 已存在, 跳过下载"
          }

      - name: 检查 speedtest 二进制
        run: |
          if (-not (Test-Path "speedtest/speedtest.exe")) {
            Write-Error "speedtest/speedtest.exe 缺失, 打包失败"
            exit 1
          }
          Write-Host "speedtest/speedtest.exe 就绪: $((Get-Item speedtest/speedtest.exe).Length) bytes"

      - name: PyInstaller 打包 (x64)
        run: |
          pyinstaller --noconfirm NetPulse.spec 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::PyInstaller 退出码 $LASTEXITCODE, 详见 build.log"
            exit $LASTEXITCODE
          }

      # x86 必须用 3.8: 3.9+ 打包的 exe 在 Win7 启动报缺
      # api-ms-win-core-path-l1-1-0.dll (该 API Set 是 Win8+ 才有)
      - name: 切换 32 位 Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'

      - name: 安装构建依赖 (x86)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller scapy

      - name: PyInstaller 打包 (x86)
        env:
          NETPULSE_ARCH: x86
        run: |
          pyinstaller --noconfirm NetPulse.spec 2>&1 | Tee-Object -FilePath build_x86.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::PyInstaller(x86) 退出码 $LASTEXITCODE, 详见 build_x86.log"
            exit $LASTEXITCODE
          }

      - name: 校验产物
        run: |
          foreach ($name in @('NetPulse', 'NetPulse_x86')) {
            if (-not (Test-Path "dist/$name.exe")) {
              Write-Error "dist/$name.exe 未生成, 构建失败"
              exit 1
            }
            $size = (Get-Item "dist/$name.exe").Length
            Write-Host "$name.exe 大小: $([math]::Round($size / 1MB, 2)) MB"
          }

      - name: 上传构建日志（成功失败都上传, 便于排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            build_x86.log
          if-no-files-found: ignore

      - name: 计算 SHA256
        id: hash
        shell: pwsh
        run: |
          $lines = foreach ($name in @('NetPulse', 'NetPulse_x86')) {
              $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.exe").Hash.ToLower()
              Write-Host "$name.exe SHA256: $hash"
              "- ``$name.exe``: ``$hash``"
          }
          # GITHUB_OUTPUT 多行值必须用 heredoc 语法 — 直接塞含换行的 key=value
          # 会被 runner 报 Invalid format (v1.14.4 首跑踩坑)
          "summary<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $lines | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: 准备 Release 资源
        shell: pwsh
        run: |
          foreach ($name in @('NetPulse', 'NetPulse_x86')) {
            Compress-Archive -Path "dist/$name.exe" -DestinationPath "dist/$name.zip" -Force
            $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.exe").Hash.ToLower()
            Set-Content -Path "dist/$name.exe.sha256.txt" -Value "$hash  $name.exe"
          }

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/NetPulse.exe
            dist/NetPulse.zip
            dist/NetPulse.exe.sha256.txt
            dist/NetPulse_x86.exe
            dist/NetPulse_x86.zip
            dist/NetPulse_x86.exe.sha256.txt
          body: |
            ## NetPulse ${{ github.ref_name }}

            **SHA256**:
            ${{ steps.hash.outputs.summary }}

            ### 下载说明
            - `NetPulse.exe` — 64 位单文件可执行版本（Windows x64）
            - `NetPulse_x86.exe` — 32 位单文件可执行版本（老机器 / 32 位 Windows；不含 Ookla 对照测速，其余功能一致）
            - `NetPulse*.zip` — 同上，ZIP 压缩版（解压后与 .exe 等价）
            - `.sha256.txt` — 哈希校验文件

            ### 校验方法
            ```powershell
            # Windows PowerShell
            Get-FileHash .\NetPulse.exe -Algorithm SHA256
            # 应与上方 SHA256 一致
            ```

            完整变更见 [CHANGELOG.md](./CHANGELOG.md)。
