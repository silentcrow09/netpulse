name: release

# 触发条件：推送 v*.*.* 形式的 tag 时自动构建并发布 Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write   # 允许创建/上传 Release 资源

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller scapy

      - name: 下载 Ookla Speedtest CLI
        shell: pwsh
        run: |
          # speedtest/ 目录被 .gitignore 忽略, GitHub 上没有 speedtest.exe
          # 但 NetPulse.spec 把它作为 datas 打包, 所以 Actions 必须先下载一份
          $dst = "speedtest/speedtest.exe"
          if (-not (Test-Path $dst)) {
            New-Item -ItemType Directory -Force -Path "speedtest" | Out-Null
            $url = "https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-win64.zip"
            Write-Host "正在从 Ookla 官方下载 Speedtest CLI..."
            $zip = "$env:TEMP\ookla-speedtest.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
            Write-Host "下载完成, 解压中..."
            Expand-Archive -Path $zip -DestinationPath "$env:TEMP\ookla-extract" -Force
            # zip 结构: speedtest.exe 直接在根
            Copy-Item "$env:TEMP\ookla-extract\speedtest.exe" -Destination $dst -Force
            Write-Host "已就位: $dst"
          } else {
            Write-Host "speedtest.exe 已存在, 跳过下载"
          }

      - name: 检查 speedtest 二进制
        run: |
          if (-not (Test-Path "speedtest/speedtest.exe")) {
            Write-Error "speedtest/speedtest.exe 缺失, 打包失败"
            exit 1
          }
          Write-Host "speedtest/speedtest.exe 就绪: $((Get-Item speedtest/speedtest.exe).Length) bytes"

      - name: PyInstaller 打包
        run: |
          pyinstaller --noconfirm NetPulse.spec 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::PyInstaller 退出码 $LASTEXITCODE, 详见 build.log"
            exit $LASTEXITCODE
          }

      - name: 校验产物
        run: |
          if (-not (Test-Path "dist/NetPulse.exe")) {
            Write-Error "dist/NetPulse.exe 未生成, 构建失败"
            exit 1
          }
          $size = (Get-Item "dist/NetPulse.exe").Length
          Write-Host "NetPulse.exe 大小: $([math]::Round($size / 1MB, 2)) MB"

      - name: 上传构建日志（成功失败都上传, 便于排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 计算 SHA256
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "dist/NetPulse.exe").Hash.ToLower()
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "SHA256: $hash"

      - name: 准备 Release 资源
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/NetPulse.exe" -DestinationPath "dist/NetPulse.zip" -Force
          Copy-Item "dist/NetPulse.exe" -Destination "dist/NetPulse.exe.sha256.txt"
          # 把哈希写进 .sha256 文件
          $hash = (Get-FileHash -Algorithm SHA256 "dist/NetPulse.exe").Hash.ToLower()
          Set-Content -Path "dist/NetPulse.exe.sha256.txt" -Value "$hash  NetPulse.exe"

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/NetPulse.exe
            dist/NetPulse.zip
            dist/NetPulse.exe.sha256.txt
          body: |
            ## NetPulse ${{ github.ref_name }}

            **SHA256**: `${{ steps.hash.outputs.sha256 }}`

            ### 下载说明
            - `NetPulse.exe` — 单文件可执行版本（约 25 MB）
            - `NetPulse.zip` — 同上，ZIP 压缩版（解压后与 .exe 等价）
            - `.sha256.txt` — 哈希校验文件

            ### 校验方法
            ```powershell
            # Windows PowerShell
            Get-FileHash .\NetPulse.exe -Algorithm SHA256
            # 应与上方 SHA256 一致
            ```

            完整变更见 [CHANGELOG.md](./CHANGELOG.md)。